<style>*{font-family:sans-serif;color:#ffe}body,div{background:#112;margin:8rem;display:flex;align-items:center;flex-direction:column}h1{margin-bottom:2rem}option,select,textarea{border:1px solid #666;border-radius:5px;background:#338;padding:4px 8px}div{background:#223;padding:2rem;border-radius:25px;margin:0}span{font-family:monospace}</style><body onload="h()"><h1>SHA-2 Playground</h1><div><textarea id="i"onkeyup="h()"placeholder="Input"></textarea><br><br><select id="a"onchange="h()"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select><br>Output:<br><br><span id="o">(output)</span></div><script>let f=a=>document.getElementById(a),i=f('i'),o=f('o'),a=f('a'),e=new TextEncoder;async function h(){o.innerText=s(new Uint8Array(await crypto.subtle.digest(a.value,e.encode(i.value))).toHex())}function s(x){x=x.split('');let u='';for(let i=0;i<x.length;i++)u+=x[i],i%16==15&&(u+="\n");return u}</script></body>
